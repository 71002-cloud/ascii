<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>ASCII Art creator</title>
  </head>
  <body>
    <header>
      <h1>ASCII Art creator</h1>
    </header>

    <main>
      <div class="working-station">
        <div class="image-upload-container">
          <input type="file" id="image-upload" accept="image/*" onchange="uploadImage()" onclick="clearCanvas()" />
          <label for="image-upload" id="upload-label">Upload Image</label>
          <div class="canvas-container">
            <canvas id="upload images" width="400" height="400"></canvas>
          </div>
        </div>
        <div class="inputs-container">
          <p id="contrast-value">1.0</p>
          <input type="range" id="contrast-slider" min="1" max="3" step="0.1" value="1" />
          <label for="contrast-slider">Adjust contrast</label>
          <input type="text" id="symbols" placeholder=", . : - = + * # @" />
          <label for="symbols">Right equals brightness and left equals darkness</label>
          <input type="text" id="width-input" placeholder="100" />
          <label for="width-input">Width of the ASCII art</label>
        </div>
      </div>

      <button id="convert" onclick="convertbtn()">Convert</button>

      <div class="ascii-container">
        <pre id="ascii-output"></pre>
        <button id="copy" onclick="copyToClipboard()">Copy</button>
      </div>
    </main>
  </body>
  <script src="src/main.js"></script>
</html>
